# Credentials come from the environment only; never commit real values.
spring.datasource.url=${DEBT_DB_URL}
spring.datasource.username=${DEBT_DB_USERNAME}
spring.datasource.password=${DEBT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DEBT_DB_POOL_SIZE:5}

# Flyway owns the schema; Hibernate validates and never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
