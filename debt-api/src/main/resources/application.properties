server.port=${DEBT_API_PORT:8080}
debt.api.allowed-origin=${DEBT_API_ALLOWED_ORIGIN:http://localhost:5173}
# Spring Boot 4's Jackson 3 fails fast when a JSON request body omits a primitive record
# component (e.g. CreateRunRequest.contextEnabled) instead of defaulting it like Jackson 2 did.
spring.jackson.deserialization.fail-on-null-for-primitives=false
springdoc.api-docs.version=openapi_3_0

# debt-persistence's datasource/Flyway/JPA settings (application-persistence.properties) are shared
# with the CLI; this API boots them in its own context.
spring.profiles.include=persistence
# Client IPs (consent records, per-IP limits) come from X-Forwarded-For behind a reverse proxy.
server.forward-headers-strategy=native

# Access codes (see AccessProperties). Durations accept 72h, 30d, 5m, ...
debt.access.run-quota=${DEBT_ACCESS_RUN_QUOTA:3}
debt.access.code-ttl=${DEBT_ACCESS_CODE_TTL:72h}
debt.access.results-ttl=${DEBT_ACCESS_RESULTS_TTL:30d}
debt.access.request-cooldown=${DEBT_ACCESS_REQUEST_COOLDOWN:5m}
debt.access.ip-limit-per-hour=${DEBT_ACCESS_IP_LIMIT:10}
debt.access.terms-version=${DEBT_ACCESS_TERMS_VERSION:v1}
debt.access.frontend-url=${DEBT_ACCESS_FRONTEND_URL:}

# Email delivery. No DEBT_MAIL_HOST = dev sender that prints codes to the log.
debt.mail.host=${DEBT_MAIL_HOST:}
debt.mail.port=${DEBT_MAIL_PORT:587}
debt.mail.username=${DEBT_MAIL_USERNAME:}
debt.mail.password=${DEBT_MAIL_PASSWORD:}
debt.mail.from=${DEBT_MAIL_FROM:}
