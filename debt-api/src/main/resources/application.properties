server.port=${DEBT_API_PORT:8080}
debt.api.allowed-origin=${DEBT_API_ALLOWED_ORIGIN:http://localhost:5173}
# Spring Boot 4's Jackson 3 fails fast when a JSON request body omits a primitive record
# component (e.g. CreateRunRequest.contextEnabled) instead of defaulting it like Jackson 2 did.
spring.jackson.deserialization.fail-on-null-for-primitives=false
